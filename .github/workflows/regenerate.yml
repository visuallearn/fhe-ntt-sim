# Rebuild every byte of docs/data/ from the pinned OpenFHE release and fail if
# the result differs from what is committed. Manual only: building OpenFHE is far
# too heavy to run on every push.
name: Regenerate and verify traces

on:
  workflow_dispatch:
  schedule:
    # Monthly, so bit-rot in the toolchain surfaces before someone needs it.
    - cron: '17 4 1 * *'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git python3

      - name: Regenerate and verify
        run: ./tools/06_all.sh

      - name: Fail if the committed data would change
        run: |
          if ! git diff --quiet -- docs/data; then
            echo "::error::docs/data/ differs from a fresh generation."
            git --no-pager diff --stat -- docs/data
            exit 1
          fi
          echo "docs/data/ matches a fresh generation from OpenFHE."
